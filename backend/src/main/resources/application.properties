spring.application.name=adc-backend
spring.datasource.url=${ADC_DB_URL:jdbc:mysql://localhost:3306/adc}
spring.datasource.username=${ADC_DB_USER:adc}
spring.datasource.password=${ADC_DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.config.import=optional:file:./application-local.properties
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
